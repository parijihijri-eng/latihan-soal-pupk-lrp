<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUPK - Lomba Regu Prestasi Penggalang SD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-pramuka-dark { background-color: #5C3A21; }
        .bg-pramuka-light { background-color: #E6C280; }
        .text-pramuka-dark { color: #5C3A21; }
        .text-pramuka-light { color: #E6C280; }
        .radio-custom:checked + label {
            background-color: #E6C280;
            border-color: #5C3A21;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div id="page-start" class="min-h-screen flex flex-col items-center justify-center p-4" style="background-image: linear-gradient(to bottom right, #5C3A21, #8B5A2B);">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Tunas_Kelapa_Pramuka.svg/512px-Tunas_Kelapa_Pramuka.svg.png" alt="Tunas Kelapa" class="w-24 h-24 mx-auto mb-4" onerror="this.style.display='none'">
            <h1 class="text-3xl font-extrabold text-pramuka-dark mb-2">Lomba Regu Prestasi (LRP)</h1>
            <p class="text-gray-600 mb-6 font-semibold">Ujian PUPK Tingkat Penggalang SD</p>
            <div class="mb-6">
                <label for="teamName" class="block text-left text-sm font-medium text-gray-700 mb-2">Nama Regu (Contoh: Harimau / Melati)</label>
                <input type="text" id="teamName" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-[#5C3A21]" placeholder="Masukkan nama regu..." required>
            </div>
            <button onclick="startQuiz()" class="w-full bg-pramuka-dark hover:bg-[#4a2e1a] text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg">
                Mulai Ujian Sekarang
            </button>
        </div>
    </div>

    <div id="page-quiz" class="hidden min-h-screen pb-12 bg-gray-50">
        <div class="bg-pramuka-dark text-white p-4 sticky top-0 z-50 shadow-md">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <h1 class="font-bold text-lg md:text-xl">PUPK Penggalang SD</h1>
                <div class="font-semibold bg-white text-pramuka-dark px-4 py-1 rounded-full shadow-sm text-sm md:text-base">
                    Regu: <span id="displayTeamName"></span>
                </div>
            </div>
        </div>
        <div class="max-w-4xl mx-auto mt-6 px-4">
            <div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-4 mb-6 rounded shadow-sm" role="alert">
                <p class="font-bold">Perhatian!</p>
                <p class="text-sm mt-1">Terdapat 50 soal pilihan ganda. Pastikan semua soal terjawab sebelum mengklik tombol selesai di paling bawah.</p>
            </div>
            <div id="quizContainer" class="space-y-6"></div>
            <button onclick="submitQuiz()" class="mt-8 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition duration-300 text-lg">
                Selesai & Kumpulkan Jawaban
            </button>
        </div>
    </div>

    <div id="page-result" class="hidden min-h-screen flex flex-col items-center justify-center p-4 bg-pramuka-light text-pramuka-dark">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-lg w-full text-center border-4 border-[#5C3A21]">
            <h1 class="text-3xl font-extrabold mb-2">Ujian Selesai!</h1>
            <p class="text-xl mb-6 font-semibold">Regu: <span id="resultTeamName" class="text-blue-600"></span></p>
            <div class="bg-gray-50 rounded-xl p-6 mb-8 border-2 border-dashed border-gray-300">
                <p class="text-gray-500 font-bold mb-2">Total Skor Anda</p>
                <p class="text-6xl font-black text-green-600"><span id="finalScore"></span></p>
                <p class="text-sm text-gray-500 mt-2 font-semibold">Skor Maksimal: 100</p>
            </div>
            <div class="space-y-4">
                <button onclick="showReview()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow">
                    Cek Jawaban Benar & Salah
                </button>
                <button onclick="location.reload()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-3 px-4 rounded-lg transition duration-300">
                    Kembali ke Halaman Awal
                </button>
            </div>
        </div>
    </div>

    <div id="page-review" class="hidden min-h-screen pb-12 bg-gray-50">
        <div class="bg-blue-800 text-white p-4 sticky top-0 z-50 shadow-md">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <h1 class="font-bold text-lg md:text-xl">Review Kunci Jawaban</h1>
                <button onclick="backToResult()" class="bg-white text-blue-800 font-bold px-4 py-1 rounded-full text-sm hover:bg-gray-200 transition shadow-sm">
                    Kembali
                </button>
            </div>
        </div>
        <div class="max-w-4xl mx-auto mt-6 px-4">
            <div id="reviewContainer" class="space-y-6"></div>
            <button onclick="backToResult()" class="mt-8 w-full bg-blue-800 hover:bg-blue-900 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition duration-300 text-lg">
                Kembali ke Skor
            </button>
        </div>
    </div>

    <script>
        const questions = [
            { q: "Siapakah Bapak Pramuka Indonesia?", options: ["Ir. Soekarno", "Ki Hajar Dewantara", "Sri Sultan Hamengkubuwono IX", "Baden Powell"], a: 2 },
            { q: "Siapakah Bapak Pandu Dunia?", options: ["Baden Powell", "Samuel Morse", "W.R. Supratman", "Soenardjo Atmodipuro"], a: 0 },
            { q: "Tanggal berapakah Baden Powell dilahirkan?", options: ["14 Agustus 1961", "22 Februari 1857", "28 Oktober 1928", "2 Mei 1889"], a: 1 },
            { q: "Hari Pramuka Indonesia diperingati setiap tanggal?", options: ["17 Agustus", "1 Juni", "14 Agustus", "28 Oktober"], a: 2 },
            { q: "Apa lambang Gerakan Pramuka Indonesia?", options: ["Bintang", "Padi dan Kapas", "Burung Garuda", "Tunas Kelapa"], a: 3 },
            { q: "Siapakah pencipta lambang Gerakan Pramuka?", options: ["Soenardjo Atmodipuro", "H. Mutahar", "Kusumaningrat", "Soedirman"], a: 0 },
            { q: "Berapakah rentang usia untuk anggota Pramuka Penggalang?", options: ["7 - 10 Tahun", "11 - 15 Tahun", "16 - 20 Tahun", "21 - 25 Tahun"], a: 1 },
            { q: "Satuan terkecil dalam Pramuka Penggalang disebut?", options: ["Barung", "Sangga", "Regu", "Pasukan"], a: 2 },
            { q: "Kumpulan dari beberapa regu Penggalang disebut?", options: ["Perindukan", "Pasukan", "Ambalan", "Racana"], a: 1 },
            { q: "Kode kehormatan bagi Pramuka Penggalang adalah?", options: ["Dwisatya dan Dwidarma", "Trisatya dan Dasadarma", "Pancasila dan UUD 1945", "Sumpah Pemuda"], a: 1 },
            { q: "Apa warna dasar untuk tanda kecakapan umum (TKU) tingkat Penggalang?", options: ["Hijau", "Kuning", "Merah", "Cokelat"], a: 2 },
            { q: "Sebutkan tingkatan TKU dalam Pramuka Penggalang secara berurutan!", options: ["Mula, Bantu, Tata", "Ramu, Rakit, Terap", "Bantara, Laksana", "Purwa, Madya, Utama"], a: 1 },
            { q: "Bentuk barisan pada upacara pembukaan latihan Pramuka Penggalang adalah?", options: ["Lingkaran", "Setengah Lingkaran (Angkare)", "Bersaf / Berderet", "Bentuk V"], a: 1 },
            { q: "Berapa ukuran standar bendera semaphore?", options: ["30 x 30 cm", "45 x 45 cm", "60 x 60 cm", "90 x 60 cm"], a: 1 },
            { q: "Warna yang terdapat pada bendera semaphore adalah?", options: ["Merah dan Putih", "Merah dan Kuning", "Hitam dan Putih", "Merah dan Hitam"], a: 1 },
            { q: "Siapakah penemu huruf Morse?", options: ["Alexander Graham Bell", "Thomas Alva Edison", "Samuel F.B. Morse", "Baden Powell"], a: 2 },
            { q: "Dalam penggunaan kompas, arah Timur menunjukkan sudut...", options: ["0 derajat", "90 derajat", "180 derajat", "270 derajat"], a: 1 },
            { q: "Tanda Kecakapan Khusus (TKK) tingkat Purwa pada Penggalang berbentuk?", options: ["Lingkaran", "Persegi / Kotak", "Segi Lima", "Segitiga"], a: 0 },
            { q: "TKK tingkat Madya berbentuk?", options: ["Lingkaran", "Persegi / Kotak", "Segi Lima", "Segitiga"], a: 1 },
            { q: "Berapa jumlah Tanda Kecakapan Khusus (TKK) wajib?", options: ["5 macam", "10 macam", "15 macam", "20 macam"], a: 1 },
            { q: "Simpul yang digunakan untuk menyambung dua utas tali yang sama besarnya dan dalam keadaan kering adalah?", options: ["Simpul Pangkal", "Simpul Jangkar", "Simpul Mati", "Simpul Anyam"], a: 2 },
            { q: "Simpul yang digunakan untuk mengawali dan mengakhiri suatu ikatan pada tiang adalah?", options: ["Simpul Pangkal", "Simpul Jangkar", "Simpul Mati", "Simpul Anyam"], a: 0 },
            { q: "Apa arti warna merah pada setangan leher (kacu) Pramuka?", options: ["Suci", "Berani", "Kaya", "Makmur"], a: 1 },
            { q: "Dalam Sandi A-N (A=N), huruf B akan berubah menjadi huruf?", options: ["M", "N", "O", "P"], a: 2 },
            { q: "Tingkatan tertinggi dari seorang Pramuka yang telah menyelesaikan Syarat Kecakapan Umum dan Syarat Kecakapan Khusus disebut?", options: ["Pramuka Teladan", "Pramuka Garuda", "Pramuka Utama", "Pramuka Mandiri"], a: 1 },
            { q: "Siapakah Presiden pertama Republik Indonesia?", options: ["Jenderal Soedirman", "B.J. Habibie", "Ir. Soekarno", "Mohammad Hatta"], a: 2 },
            { q: "Apa dasar negara Republik Indonesia?", options: ["Bhinneka Tunggal Ika", "Pancasila", "UUD 1945", "Garuda Pancasila"], a: 1 },
            { q: "Semboyan negara Indonesia adalah...", options: ["Bhinneka Tunggal Ika", "Tut Wuri Handayani", "Kartika Eka Paksi", "Jalesveva Jayamahe"], a: 0 },
            { q: "Apa judul lagu kebangsaan Indonesia?", options: ["Bagimu Negeri", "Garuda Pancasila", "Indonesia Pusaka", "Indonesia Raya"], a: 3 },
            { q: "Siapakah pencipta lagu kebangsaan Indonesia Raya?", options: ["W.R. Supratman", "Ibu Soed", "Ismail Marzuki", "C. Simanjuntak"], a: 0 },
            { q: "Ibu kota Provinsi Jawa Barat adalah...", options: ["Surabaya", "Semarang", "Bandung", "Banten"], a: 2 },
            { q: "Teks Proklamasi Kemerdekaan Indonesia dibacakan pada tanggal?", options: ["17 Agustus 1945", "20 Mei 1908", "28 Oktober 1928", "1 Juni 1945"], a: 0 },
            { q: "Siapakah pahlawan wanita yang berasal dari Aceh?", options: ["R.A. Kartini", "Cut Nyak Dien", "Dewi Sartika", "Martha Christina Tiahahu"], a: 1 },
            { q: "Benua terluas di dunia adalah...", options: ["Benua Amerika", "Benua Afrika", "Benua Eropa", "Benua Asia"], a: 3 },
            { q: "Samudra terluas di dunia adalah...", options: ["Samudra Hindia", "Samudra Pasifik", "Samudra Atlantik", "Samudra Arktik"], a: 1 },
            { q: "Siapakah pengetik naskah proklamasi kemerdekaan Indonesia?", options: ["Sayuti Melik", "Sukarni", "Ahmad Soebardjo", "Laksamana Maeda"], a: 0 },
            { q: "Candi bercorak Buddha terbesar di Indonesia adalah...", options: ["Candi Prambanan", "Candi Borobudur", "Candi Mendut", "Candi Singasari"], a: 1 },
            { q: "Siapakah yang dijuluki sebagai Bapak Pendidikan Nasional?", options: ["Ir. Soekarno", "Ki Hajar Dewantara", "Mohammad Hatta", "Jenderal Soedirman"], a: 1 },
            { q: "Hari Pendidikan Nasional diperingati setiap tanggal?", options: ["2 Mei", "1 Juni", "17 Agustus", "10 November"], a: 0 },
            { q: "Apa nama ibu kota negara Malaysia?", options: ["Singapura", "Bangkok", "Kuala Lumpur", "Manila"], a: 2 },
            { q: "Mata uang negara Jepang adalah...", options: ["Yuan", "Won", "Yen", "Baht"], a: 2 },
            { q: "Proses tumbuhan hijau membuat makanannya sendiri dengan bantuan cahaya matahari disebut?", options: ["Respirasi", "Fotosintesis", "Metamorfosis", "Oksidasi"], a: 1 },
            { q: "Hewan mamalia yang dapat terbang adalah...", options: ["Burung Hantu", "Kelelawar", "Kupu-kupu", "Ayam"], a: 1 },
            { q: "Planet terdekat dari matahari dalam tata surya kita adalah...", options: ["Venus", "Bumi", "Mars", "Merkurius"], a: 3 },
            { q: "Alat yang digunakan untuk mengukur suhu tubuh adalah...", options: ["Barometer", "Anemometer", "Termometer", "Dinamometer"], a: 2 },
            { q: "Gunung tertinggi di Indonesia yang terletak di Papua adalah...", options: ["Gunung Semeru", "Gunung Kerinci", "Gunung Rinjani", "Puncak Jaya / Jayawijaya"], a: 3 },
            { q: "Kerajaan Hindu tertua di Indonesia adalah...", options: ["Kerajaan Tarumanegara", "Kerajaan Majapahit", "Kerajaan Kutai", "Kerajaan Sriwijaya"], a: 2 },
            { q: "Sila ketiga dari Pancasila berbunyi...", options: ["Ketuhanan Yang Maha Esa", "Kemanusiaan yang adil dan beradab", "Persatuan Indonesia", "Keadilan sosial bagi seluruh rakyat Indonesia"], a: 2 },
            { q: "Apa lambang dari sila ke-4 Pancasila?", options: ["Bintang", "Rantai", "Pohon Beringin", "Kepala Banteng"], a: 3 },
            { q: "Sumpah Pemuda diperingati setiap tanggal?", options: ["20 Mei", "14 Agustus", "28 Oktober", "10 November"], a: 2 }
        ];

        let currentTeam = "";
        let userAnswers = new Array(50).fill(null);
        let score = 0;

        function startQuiz() {
            const teamInput = document.getElementById('teamName').value.trim();
            if (teamInput === "") {
                alert("Mohon masukkan Nama Regu Anda terlebih dahulu!");
                return;
            }
            currentTeam = teamInput;
            document.getElementById('displayTeamName').innerText = currentTeam;
            document.getElementById('page-start').classList.add('hidden');
            document.getElementById('page-quiz').classList.remove('hidden');
            renderQuestions();
            window.scrollTo(0, 0);
        }

        function renderQuestions() {
            const container = document.getElementById('quizContainer');
            container.innerHTML = "";

            questions.forEach((q, index) => {
                const questionBox = document.createElement('div');
                questionBox.className = "bg-white p-6 rounded-xl shadow-sm border border-gray-200";

                let optionsHtml = "";
                q.options.forEach((opt, optIndex) => {
                    optionsHtml += `
                        <div class="mb-3">
                            <input type="radio" name="q${index}" id="q${index}_opt${optIndex}" value="${optIndex}" class="hidden radio-custom" onchange="saveAnswer(${index}, ${optIndex})">
                            <label for="q${index}_opt${optIndex}" class="block w-full border border-gray-300 rounded-lg p-3 cursor-pointer hover:bg-gray-100 transition shadow-sm">
                                <span class="font-bold mr-2 text-gray-700">${String.fromCharCode(65 + optIndex)}.</span> <span class="text-gray-800">${opt}</span>
                            </label>
                        </div>`;
                });

                questionBox.innerHTML = `
                    <div class="mb-4">
                        <span class="inline-block bg-pramuka-dark text-white font-bold px-3 py-1 rounded-full text-xs md:text-sm mb-3">Soal ${index + 1}</span>
                        <h3 class="text-base md:text-lg font-bold text-gray-800">${q.q}</h3>
                    </div>
                    <div>${optionsHtml}</div>`;
                container.appendChild(questionBox);
            });
        }

        function saveAnswer(questionIndex, optionIndex) {
            userAnswers[questionIndex] = optionIndex;
        }

        function submitQuiz() {
            const unanswered = userAnswers.filter(a => a === null).length;
            if (unanswered > 0) {
                const confirmSubmit = confirm(`Ada ${unanswered} soal yang belum Anda jawab. Anda yakin ingin mengumpulkan sekarang? (Jawaban kosong bernilai salah)`);
                if (!confirmSubmit) return;
            }

            let correctCount = 0;
            questions.forEach((q, index) => {
                if (userAnswers[index] === q.a) correctCount++;
            });
            score = correctCount * 2;

            document.getElementById('resultTeamName').innerText = currentTeam;
            document.getElementById('finalScore').innerText = score;
            document.getElementById('page-quiz').classList.add('hidden');
            document.getElementById('page-result').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function showReview() {
            document.getElementById('page-result').classList.add('hidden');
            document.getElementById('page-review').classList.remove('hidden');

            const container = document.getElementById('reviewContainer');
            container.innerHTML = "";

            questions.forEach((q, index) => {
                const userAnswer = userAnswers[index];
                const isCorrect = userAnswer === q.a;

                const questionBox = document.createElement('div');
                questionBox.className = `bg-white p-5 md:p-6 rounded-xl shadow-sm border-l-8 ${isCorrect ? 'border-green-500' : 'border-red-500'}`;

                let optionsHtml = "";
                q.options.forEach((opt, optIndex) => {
                    let wrapperClass = "w-full border border-gray-300 rounded-lg p-3 mb-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2";
                    let textClass = "text-gray-700";
                    let badgeHtml = "";

                    if (optIndex === q.a) {
                        wrapperClass = "w-full border-2 border-green-500 bg-green-50 rounded-lg p-3 mb-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2";
                        textClass = "font-bold text-green-800";
                        badgeHtml = `<span class="bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-full whitespace-nowrap shadow-sm">✅ Benar</span>`;
                    } else if (userAnswer === optIndex && !isCorrect) {
                        wrapperClass = "w-full border-2 border-red-500 bg-red-50 rounded-lg p-3 mb-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2";
                        textClass = "font-bold text-red-600 line-through opacity-80";
                        badgeHtml = `<span class="bg-red-600 text-white text-xs font-bold px-3 py-1 rounded-full whitespace-nowrap shadow-sm">❌ Jawaban Regumu</span>`;
                    }

                    optionsHtml += `
                        <div class="${wrapperClass}">
                            <div class="${textClass} flex-1 leading-relaxed">
                                <span class="font-bold mr-1">${String.fromCharCode(65 + optIndex)}.</span> ${opt}
                            </div>
                            ${badgeHtml ? `<div>${badgeHtml}</div>` : ''}
                        </div>`;
                });

                questionBox.innerHTML = `
                    <div class="mb-4 flex justify-between items-center border-b pb-3">
                        <span class="inline-block bg-gray-100 text-gray-600 font-bold px-3 py-1 rounded-full text-xs md:text-sm">Soal ${index + 1}</span>
                        <span class="font-bold text-sm md:text-base ${isCorrect ? 'text-green-600' : 'text-red-600'}">${isCorrect ? '+2 Poin' : '0 Poin'}</span>
                    </div>
                    <h3 class="text-base md:text-lg font-bold text-gray-800 mb-4 leading-relaxed">${q.q}</h3>
                    <div>${optionsHtml}</div>`;
                container.appendChild(questionBox);
            });
            window.scrollTo(0, 0);
        }

        function backToResult() {
            document.getElementById('page-review').classList.add('hidden');
            document.getElementById('page-result').classList.remove('hidden');
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
